<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Vibing</title>

    <script src="https://telegram.org/js/telegram-web-app.js"> </script>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
       #friendsBtn {
    position: fixed;
    right: 18px;
    top: 18px;

    width: 54px;
    height: 54px;

    z-index: 1001;

    border: none;
    border-radius: 50%;

    background: white;

    font-size: 24px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.25);

    transition: transform 0.2s ease;
}

#friendsBtn:active {
    transform: scale(0.9);
}
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

       
   #friendsPanel {
    position: fixed;
    top: 85px;
    left: 12px;
    right: 12px;

    z-index: 1000;

    background: white;
    border-radius: 20px;
    padding: 16px;

    box-shadow: 0 5px 25px rgba(0,0,0,0.25);

    transform: translateY(-30px);
    opacity: 0;
    pointer-events: none;

    transition:
        transform 0.35s ease,
        opacity 0.25s ease;
}

#friendsPanel.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
}

#friendsPanel.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
}

#friendsPanel h2 {
    margin: 0 0 12px;
    font-size: 20px;
}

#usernameInput {
    width: calc(100% - 75px);
    padding: 12px;

    border: 1px solid #ddd;
    border-radius: 12px;

    font-size: 15px;
}

#searchBtn {
    width: 65px;
    padding: 12px 5px;

    border: none;
    border-radius: 12px;

    background: #2481cc;
    color: white;
    font-weight: 600;
}

#searchResult {
    margin-top: 12px;
}
#friendsPanel h2 {
    margin: 0 0 10px;
    font-size: 20px;
}

#usernameInput {
    width: 65%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

#searchBtn {
    padding: 11px 14px;
    margin-left: 5px;

    border: none;
    border-radius: 10px;

    background: #2481cc;
    color: white;
    font-weight: 600;
}

#searchResult {
    margin-top: 10px;
} 
   const friendsBtn = document.getElementById('friendsBtn');
const friendsPanel = document.getElementById('friendsPanel');

friendsBtn.addEventListener('click', () => {
    friendsPanel.classList.toggle('open');
}); 
        #friendRequests {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}

#friendRequests h3 {
    margin: 0 0 10px;
    font-size: 17px;
}

.requestItem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;

    padding: 10px 0;
}

.requestButtons {
    display: flex;
    gap: 6px;
}

.acceptBtn,
.rejectBtn {
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    font-weight: 600;
}

.acceptBtn {
    background: #2481cc;
    color: white;
}

.rejectBtn {
    background: #eee;
    color: #333;
}
    /* Финальное положение кнопки геолокации */
#locationBtn {
    position: fixed !important;
    left: 18px !important;
    right: auto !important;
    bottom: 18px !important;
    top: auto !important;

    z-index: 1001 !important;

    border: none !important;
    border-radius: 14px !important;

    padding: 14px 22px !important;

    font-size: 16px !important;
    font-weight: 600 !important;

    background: #2481cc !important;
    color: white !important;

    box-shadow: 0 4px 15px rgba(0,0,0,0.25) !important;

    box-sizing: border-box !important;
}

#locationBtn:active {
    transform: scale(0.96) !important;
}

#locationBtn:active {
    transform: scale(0.96) !important;
}
    </style>
</head>

<body>

<div id="map"></div>
    <button id="friendsBtn">👥</button>
    <div id="friendsPanel">
    <h2>👥 Друзья</h2>

    <input
        id="usernameInput"
        type="text"
        placeholder="@username"
    >

    <button id="searchBtn">
        🔎 Найти
    </button>

    <div id="searchResult"></div>
        <div id="friendRequests">
    <h3>📨 Входящие запросы</h3>
    <div id="requestsList">Загрузка...</div>
</div>
        
</div>
        <button id="locationBtn">
    📍 Показать меня
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const tg = window.Telegram.WebApp;
    const SUPABASE_URL = 'https://ddvdeujtfrjchdadswmc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ivn7KvJJSH_ncqzDfhQ1Ug_5GVmUquX';

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
async function saveProfile() {
    const user = tg.initDataUnsafe?.user;

    if (!user) {
        console.log('Telegram user не найден');
        return;
    }

    const { error } = await supabaseClient
        .from('profiles')
        .upsert({
            telegram_id: String(user.id),
            username: user.username || null
        }, {
            onConflict: 'telegram_id'
        });

    if (error) {
    alert('Ошибка Supabase: ' + error.message);
    console.error('Profile error:', error);
    return;
    }

    console.log('Профиль Vibing сохранён ✅');
}

saveProfile();
    document.getElementById('searchBtn').addEventListener('click', async () => {
    const input = document.getElementById('usernameInput');
    const result = document.getElementById('searchResult');

    const username = input.value.trim().replace('@', '');

    if (!username) {
        result.textContent = 'Введите username';
        return;
    }

    const { data, error } = await supabaseClient
        .from('profiles')
        .select('telegram_id, username')
        .eq('username', username)
        .maybeSingle();

    if (error) {
        result.textContent = 'Ошибка поиска';
        console.error(error);
        return;
    }

    if (!data) {
        result.textContent = 'Пользователь не найден 😕';
        return;
    }

    result.innerHTML = `
        👤 @${data.username}
        <br>
        <button id="addFriendBtn">➕ Добавить в друзья</button>
    `;
});
    document.addEventListener('click', async (event) => {
    if (event.target.id !== 'addFriendBtn') {
        return;
    }

    const currentUser = tg.initDataUnsafe?.user;

    if (!currentUser) {
        alert('Не удалось определить Telegram-пользователя');
        return;
    }

    const username = document.getElementById('usernameInput')
        .value
        .trim()
        .replace('@', '');

    const { data: friend, error: findError } = await supabaseClient
        .from('profiles')
        .select('telegram_id, username')
        .eq('username', username)
        .maybeSingle();

    if (findError || !friend) {
        alert('Пользователь не найден');
        return;
    }

    if (String(friend.telegram_id) === String(currentUser.id)) {
        alert('Нельзя добавить самого себя 😄');
        return;
    }

    const { error } = await supabaseClient
        .from('friendships')
        .insert({
            user_id: String(currentUser.id),
            friend_id: String(friend.telegram_id),
            status: 'pending'
        });

    if (error) {
        console.error(error);
        alert('Не удалось отправить запрос: ' + error.message);
        return;
    }

    alert('Запрос отправлен! 👥');
});
    tg.ready();
    tg.expand();

    // Создаём карту
    const map = L.map('map').setView([41.2995, 69.2401], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let userMarker = null;
    let locationVisible = false;

    const locationBtn = document.getElementById('locationBtn');

    locationBtn.addEventListener('click', function () {

        // Если точка уже показана — скрываем её
        if (locationVisible) {

            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }

            locationVisible = false;
            locationBtn.textContent = '📍 Показать меня';

            return;
        }

        // Проверяем поддержку геолокации
        if (!navigator.geolocation) {
            alert('Ваш браузер не поддерживает геолокацию');
            return;
        }

        locationBtn.textContent = '📍 Определяем...';

        navigator.geolocation.watchPosition(

            function(position) {

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                if (userMarker) {
    userMarker.setLatLng([lat, lon]);
} else {
    userMarker = L.marker([lat, lon])
        .addTo(map)
        .bindPopup('📍 Вы здесь')
        .openPopup();
            }

                map.setView([lat, lon], 16);

                locationVisible = true;

                locationBtn.textContent = '👻 Скрыть меня';
            },

            function(error) {

                locationBtn.textContent = '📍 Показать меня';

                alert(
                    'Не удалось получить местоположение. ' +
                    'Разрешите доступ к геолокации.'
                );
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });
const friendsBtn = document.getElementById('friendsBtn');
const friendsPanel = document.getElementById('friendsPanel');

if (friendsBtn && friendsPanel) {
    friendsBtn.addEventListener('click', function () {
        friendsPanel.classList.toggle('open');
    });
}
async function loadFriendRequests() {
    const requestsList = document.getElementById('requestsList');
    const currentUser = tg.initDataUnsafe?.user;

    if (!currentUser) {
        requestsList.textContent = 'Не удалось определить пользователя';
        return;
    }

    const { data: requests, error } = await supabaseClient
        .from('friendships')
        .select('user_id')
        .eq('friend_id', String(currentUser.id))
        .eq('status', 'pending');

    if (error) {
        console.error(error);
        requestsList.textContent = 'Ошибка загрузки запросов';
        return;
    }

    if (!requests || requests.length === 0) {
        requestsList.textContent = 'Нет новых запросов';
        return;
    }

    requestsList.innerHTML = '';

    for (const request of requests) {
        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('username')
            .eq('telegram_id', request.user_id)
            .maybeSingle();

        const username = profile?.username || 'Пользователь';

        const item = document.createElement('div');
        item.className = 'requestItem';

        item.innerHTML = `
            <span>👤 @${username}</span>

            <div class="requestButtons">
                <button class="acceptBtn">✓</button>
                <button class="rejectBtn">✕</button>
            </div>
        `;

        item.querySelector('.acceptBtn').addEventListener('click', async () => {
            const { error } = await supabaseClient
                .from('friendships')
                .update({ status: 'accepted' })
                .eq('user_id', request.user_id)
                .eq('friend_id', String(currentUser.id))
                .eq('status', 'pending');

            if (error) {
                alert('Ошибка: ' + error.message);
                return;
            }

            loadFriendRequests();
        });

        item.querySelector('.rejectBtn').addEventListener('click', async () => {
            const { error } = await supabaseClient
                .from('friendships')
                .delete()
                .eq('user_id', request.user_id)
                .eq('friend_id', String(currentUser.id))
                .eq('status', 'pending');

            if (error) {
                alert('Ошибка: ' + error.message);
                return;
            }

            loadFriendRequests();
        });

        requestsList.appendChild(item);
    }
}

// realtime GPS
let locationWatcher = null;

function startRealtimeLocation() {
    if (!navigator.geolocation) {
        console.log('Geolocation is not supported');
        return;
    }

    locationWatcher = navigator.geolocation.watchPosition(
        async (position) => {
            const user = tg.initDataUnsafe?.user;

            if (!user) return;

            const { error } = await supabaseClient
                .from('profiles')
                .update({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    location_updated_at: new Date().toISOString()
                })
                .eq('telegram_id', String(user.id));

            if (error) {
                console.error('Realtime location error:', error);
            }
        },
        (error) => {
            console.error('GPS error:', error);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }
    );
}

startRealtimeLocation();
    
 let friendMarkers = {};

async function loadFriendsOnMap() {
    const user = tg.initDataUnsafe?.user;

    if (!user) return;

    // Получаем принятые дружеские связи
    const { data: friendships, error } = await supabaseClient
        .from('friendships')
        .select('user_id, friend_id')
        .eq('status', 'accepted')
        .or(
            `user_id.eq.${String(user.id)},friend_id.eq.${String(user.id)}`
        );

    if (error) {
        console.error('Friends error:', error);
        return;
    }

    if (!friendships) return;

    const friendIds = friendships.map(friendship => {
        return String(friendship.user_id) === String(user.id)
            ? String(friendship.friend_id)
            : String(friendship.user_id);
    });

    if (friendIds.length === 0) return;

    // Получаем профили друзей вместе с координатами
    const { data: friends, error: friendsError } = await supabaseClient
        .from('profiles')
        .select('telegram_id, username, latitude, longitude')
        .in('telegram_id', friendIds);

    if (friendsError) {
        console.error('Profiles error:', friendsError);
        return;
    }

    friends.forEach(friend => {
        if (friend.latitude == null || friend.longitude == null) return;

        const id = String(friend.telegram_id);
        const position = [
            friend.latitude,
            friend.longitude
        ];

        if (friendMarkers[id]) {
            friendMarkers[id].setLatLng(position);
        } else {
            friendMarkers[id] = L.marker(position)
                .addTo(map)
                .bindPopup(`👤 @${friend.username || 'Пользователь'}`);
        }
    });
}

loadFriendsOnMap();
    const friendsLocationChannel = supabaseClient
    .channel('friends-location-updates')
    .on(
        'postgres_changes',
        {
            event: 'UPDATE',
            schema: 'public',
            table: 'profiles'
        },
        (payload) => {
            const friend = payload.new;

            if (
                friend.latitude == null ||
                friend.longitude == null
            ) {
                return;
            }

            const id = String(friend.telegram_id);

            // Если это не отображаемый друг — ничего не делаем
            if (!friendMarkers[id]) {
                return;
            }

            friendMarkers[id].setLatLng([
                friend.latitude,
                friend.longitude
            ]);
        }
    )
    .subscribe();
    
loadFriendRequests();
</script>

</body>
</html>
